name: Dependency Guard

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] checks trusted base script only; never checks out PR head
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: dependency-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-guard:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted base workflow scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Label, comment, and guard dependency changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # This public fork has no relationship with OpenClaw's upstream SecOps
          # team. Keep the SHA-bound review gate, but designate the fork owner as
          # its accountable release approver.
          OPENCLAW_SECURITY_APPROVERS: ebakoachere
          OPENCLAW_SECURITY_TEAM_SLUG: ""
        run: node scripts/github/dependency-guard.mjs
